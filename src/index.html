<!DOCTYPE html>
<html>
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Погода</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <div class="card">
            <h1>Погода</h1>

            <div class="search">
                <input type="text" id="cityInput" placeholder="Введите город (на английском)" value="Moscow">
            <button id="searchBtn">Найти</button>
            </div>

            <p class="error" id="error"></p>

            <div class="weather-info" id="weatherInfo">
            <h2 id="cityName">Moscow</h2>
            <div class="temp" id="temp">--</div>
            <div class="description" id="description">--</div>
      
            <div class="details">
                <div class="detail-item">
                    <div class="detail-value" id="humidity">%</div>
                    <div class="detail-label">Влажность</div>
                </div>
                <div class="detail-item">
                    <div class="detail-value" id="wind">м/с</div>
                    <div class="detail-label">Ветер</div>
                </div>
                <div class="detail-item">
                    <div class="detail-value" id="feels">°C</div>
                    <div class="detail-label">Ощущается</div>
                </div>
            </div>
        </div>

        </div>

        <script src="script.js"></script>

    </body>
</html>
